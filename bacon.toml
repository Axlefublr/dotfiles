# [[sort on]]
# help_line = false
default_job = 'doc'
on_change_strategy = 'kill_then_restart'
# [[sort off]]

[exports.locations]
auto = true
exporter = 'locations'
path = '.bacon-locations'
line_format = '{path}:{line}:{column}'

[jobs.fix]
command = [
  'cargo',
  'clippy',
  '--fix',
  '--workspace',
  '--allow-dirty',
  '--allow-staged',
]
on_success = 'back'

[jobs.doc-open]
command = [ 'cargo-doc-quick.fish', 'cargo', 'doc', '--no-deps', '--keep-going', '--workspace' ]
need_stdout = false
on_success = 'job:clippy'

[jobs.doc]
command = [ 'cargo', 'doc', '--no-deps', '--keep-going', '--workspace' ]
need_stdout = false
on_success = 'job:clippy'

[jobs.doc-dep]
command = [ 'cargo', 'doc', '--keep-going', '--workspace' ]
need_stdout = false
on_success = 'job:clippy'

