# [[sort on]]
default_color = '#e84046'
default_tool = 'arrow'
feedback_duration_ms = 500
freeze_on_activate = true
remember_last_tool = false
remember_tool_properties = false
stroke_size = 6.0
# [[sort off]]
# [[sort on]]
tools.arrow.roundness = 1.0
tools.line.roundness = 1.0
tools.pen.stops.size = [ 50 ]
tools.rectangle.roundness = 0.0
tools.text.background = true
tools.text.font.family = 'sans-serif, Twemoji'
tools.text.roundness = 0.4
tools.text.size = 30.0
tools.text.steps.size = 1.0
# [[sort off]]
palette = [
  '#e84046', # red
  '#ef8f4f', # orange
  '#eed14d', # yellow
  '#4dd54f', # green
  '#0483fa', # blue
  '#7c58ea', # purple
  '#ebebeb', # white
  '#141414', # black
]
